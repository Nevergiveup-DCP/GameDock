name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with csc
        shell: cmd
        run: build.bat
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameDock
          path: |
            GameDock.exe
            gamedock.ico
            gamedock_256.png